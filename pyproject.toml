[project]
name = "journeycapture"
version = "0.1.0"
description = "Windows thin client exposing a local REST API for remote mouse/keyboard control and screenshot capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
journeycapture = "journeycapture:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
